name: ANE Gates

# Every push and pull request to main must pass all ANE gates, including the
# negative self-test that proves the gates actually fail on injected defects.
# The workflow runs the same single entry point as local development
# (tools/check_all.py --self-test), so a gate that passes locally cannot
# silently diverge in CI. Zero third-party dependencies: only Python's standard
# library is used by the gate tools and fixtures.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Payload / terms / dual-format / whitelist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run all ANE gates and negative self-test
        run: python tools/check_all.py --self-test

      - name: Emit machine-readable gate summary
        if: always()
        run: python tools/check_all.py --self-test --json
